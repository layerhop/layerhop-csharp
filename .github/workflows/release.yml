name: Release
# Publishes the LayerHop package to NuGet when a version tag is pushed (requires the NUGET_API_KEY
# repository secret). A version that is already on NuGet is skipped. Unity users install from this
# repository's git URL pinned to the same tag (see README).
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  HAS_KEY: ${{ secrets.NUGET_API_KEY != '' }}
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test
      - run: dotnet pack src/LayerHop -c Release -o out
      - if: env.HAS_KEY != 'true'
        run: echo "::notice::NUGET_API_KEY is not set; skipping NuGet (Unity installs from this tag via the git URL)."
      - if: env.HAS_KEY == 'true'
        run: dotnet nuget push "out/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
